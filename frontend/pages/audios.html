  <script>
    (function () {
      const banco = window.bancoConteudosModulares || {};
      const ids = Object.keys(banco);
      const params = new URLSearchParams(window.location.search);
      const idInicial = params.get("id") && banco[params.get("id")] ? params.get("id") : ids[0];

      const sel = document.getElementById("sel-topico-audio");
      const destino = document.getElementById("player-audio-destino");

      ids.forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = banco[id].titulo || banco[id].nome || id;
        if (id === idInicial) opt.selected = true;
        sel.appendChild(opt);
      });

      function acharBlocoAudio(obj) {
        if (!obj || typeof obj !== "object") return "";
        if (obj.id === "audioaula_podcast" && typeof obj.html === "string") return obj.html;
        if (typeof obj.audioaula_podcast === "string") return obj.audioaula_podcast;
        for (const k of Object.keys(obj)) {
          const val = obj[k];
          if (Array.isArray(val)) {
            for (const item of val) {
              const achado = acharBlocoAudio(item);
              if (achado) return achado;
            }
          } else if (val && typeof val === "object") {
            const achado = acharBlocoAudio(val);
            if (achado) return achado;
          }
        }
        return "";
      }

      function renderizar(id) {
        const topico = banco[id];
        if (!topico) return;
        const dadosEnr = (typeof window.obterResumoMultiformato === 'function') ? window.obterResumoMultiformato(id) : null;
        const htmlAudio = (dadosEnr && dadosEnr.formatos && dadosEnr.formatos.audioaula_podcast) || acharBlocoAudio(topico);
        destino.innerHTML = htmlAudio || "<div style='padding:24px;background:#0f172a;border-radius:16px;'>Nenhum áudio disponível para este tema.</div>";
        const url = new URL(window.location);
        url.searchParams.set("id", id);
        window.history.replaceState({}, "", url);
      }

      sel.addEventListener("change", () => renderizar(sel.value));
      if (idInicial) renderizar(idInicial);
    })();
  </script>
